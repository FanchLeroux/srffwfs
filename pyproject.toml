[project]
name = "srffwfs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fleroux", email = "francois.leroux.pro@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "maoppy>=1.7.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "oopao>=1.0.0",
    "tqdm>=4.70.1",
]

[project.scripts]
srffwfs = "srffwfs:main"

[project.optional-dependencies]
gpu = ["cupy-cuda12x[ctk]>=14.2.0"]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pyside6>=6.8,<6.10",
]
